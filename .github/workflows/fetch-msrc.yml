name: Fetch MSRC CVE Data

on:
  schedule:
    - cron: '0 * * * *' # Automatically runs every hour
  workflow_dispatch:     # Manual trigger from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and Parse 12 Months of MSRC Data
        run: |
          mkdir -p data
          python3 winsecurity.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/msrc_cves.json
          git diff --staged --quiet || git commit -m "chore: update rolling 12-month MSRC CVE data [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git push
